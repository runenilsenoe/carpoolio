name: Deploy Carpoolio

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: carpoolio-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  deploy:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 20
    environment: production
    steps:
      - name: Deploy production
        env:
          DEPLOY_ENV_FILE: ${{ vars.CARPOOLIO_DEPLOY_ENV_FILE }}
        shell: bash
        run: |
          set -euo pipefail
          deploy_dir="/Users/Mediafrasor/carpoolio"
          env_file="${DEPLOY_ENV_FILE:-$HOME/.config/carpoolio/production.env}"

          test -d "$deploy_dir/.git"
          test -f "$env_file"

          cd "$deploy_dir"

          echo "Updating source..."
          git fetch origin main
          git reset --hard origin/main

          echo "Docker version..."
          docker --version
          docker-compose --version

          echo "Validating configuration..."
          docker-compose --env-file "$env_file" config --quiet

          echo "Building..."
          docker-compose --env-file "$env_file" build

          echo "Starting..."
          docker-compose --env-file "$env_file" up --detach --remove-orphans

          echo "Running containers:"
          docker-compose --env-file "$env_file" ps

          echo "Checking API..."
          http_port="$(awk -F= '$1 == "HTTP_PORT" { print $2 }' "$env_file")"
          http_port="${http_port:-8080}"
          curl --fail --retry 12 --retry-delay 2 "http://127.0.0.1:${http_port}/health"
