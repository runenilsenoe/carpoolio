name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: carpoolio-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test-and-deploy:
    runs-on: self-hosted
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - name: Verify runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          # Propagate the active Docker context to Testcontainers. This works
          # with Docker Desktop, Colima, and other macOS Docker backends.
          docker_host="$(docker context inspect "$(docker context show)" --format '{{ .Endpoints.docker.Host }}')"
          test -n "$docker_host"
          export DOCKER_HOST="$docker_host"
          echo "DOCKER_HOST=$DOCKER_HOST" >> "$GITHUB_ENV"
          command -v docker-compose
          docker version
          docker-compose version
          dotnet --info

      - name: Verify backend
        run: dotnet test Carpoolio.sln --configuration Release

      - name: Deploy containers
        env:
          DEPLOY_ENV_FILE: ${{ vars.CARPOOLIO_DEPLOY_ENV_FILE }}
        shell: bash
        run: |
          set -euo pipefail
          env_file="${DEPLOY_ENV_FILE:-$HOME/.config/carpoolio/production.env}"
          test -f "$env_file"
          docker-compose --env-file "$env_file" config --quiet
          docker-compose --env-file "$env_file" up --detach --build --remove-orphans
          docker-compose --env-file "$env_file" ps

      - name: Verify deployed API
        env:
          DEPLOY_ENV_FILE: ${{ vars.CARPOOLIO_DEPLOY_ENV_FILE }}
        shell: bash
        run: |
          set -euo pipefail
          env_file="${DEPLOY_ENV_FILE:-$HOME/.config/carpoolio/production.env}"
          http_port="$(awk -F= '$1 == "HTTP_PORT" { print $2 }' "$env_file")"
          http_port="${http_port:-8080}"
          curl --fail --retry 12 --retry-delay 2 "http://127.0.0.1:${http_port}/health"
