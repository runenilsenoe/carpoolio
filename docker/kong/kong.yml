_format_version: "2.1"
_transform: true

###
# Declarative Kong config for the self-hosted Supabase API gateway.
# Environment variables (\$SUPABASE_ANON_KEY, \$SUPABASE_SERVICE_KEY,
# \$CORS_ALLOWED_ORIGINS) are substituted at container start.
###

consumers:
  - username: anon
    keyauth_credentials:
      - key: \$SUPABASE_ANON_KEY
  - username: service_role
    keyauth_credentials:
      - key: \$SUPABASE_SERVICE_KEY

acls:
  - consumer: anon
    group: anon
  - consumer: service_role
    group: admin

services:
  - name: auth-v1
    url: http://auth:9999/
    routes:
      - name: auth-v1-route
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: cors
        config:
          origins: [\$CORS_ALLOWED_ORIGINS]
          methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD]
          headers:
            [
              Accept,
              Authorization,
              Content-Type,
              apikey,
              x-client-info,
              x-supabase-api-version,
              range,
              prefer,
            ]
          exposed_headers:
            [Content-Range, Content-Length, X-Kong-Upstream-Latency]
          credentials: true
          max_age: 3600

  - name: rest-v1
    url: http://rest:3000/
    routes:
      - name: rest-v1-route
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors
        config:
          origins: [\$CORS_ALLOWED_ORIGINS]
          methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD]
          headers:
            [
              Accept,
              Authorization,
              Content-Type,
              apikey,
              x-client-info,
              range,
              prefer,
              Content-Profile,
              Accept-Profile,
            ]
          exposed_headers: [Content-Range, Content-Length]
          credentials: true
          max_age: 3600
      - name: key-auth
        config:
          hide_credentials: true
          key_names: [apikey]
      - name: acl
        config:
          hide_groups_header: true
          allow: [anon, admin]

  - name: storage-v1
    url: http://storage:5000/
    routes:
      - name: storage-v1-route
        strip_path: true
        paths:
          - /storage/v1/
    plugins:
      - name: cors
        config:
          origins: [\$CORS_ALLOWED_ORIGINS]
          methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD]
          headers:
            [Accept, Authorization, Content-Type, apikey, x-client-info, range]
          exposed_headers: [Content-Range, Content-Length]
          credentials: true
          max_age: 3600

  - name: realtime-v1
    url: http://realtime:4000/socket/
    routes:
      - name: realtime-v1-route
        strip_path: true
        paths:
          - /realtime/v1/
    plugins:
      - name: cors
        config:
          origins: [\$CORS_ALLOWED_ORIGINS]
          methods: [GET, POST, OPTIONS]
          headers: [Accept, Authorization, Content-Type, apikey, x-client-info]
          credentials: true
          max_age: 3600
