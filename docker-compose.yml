name: carpoolio

services:
  api:
    build:
      context: ./backend
      dockerfile: Carpoolio.Api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      PHONE_ENCRYPTION_KEY: ${PHONE_ENCRYPTION_KEY:?required}
      PHONE_HASH_KEY: ${PHONE_HASH_KEY:?required}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:?required}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?required}
      LOG_FILE_PATH: /app/logs/api.jsonl
    volumes:
      - api-logs:/app/logs

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: "3000"
      CARPOOL_API_URL: http://api:8080/api

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
      - api
    volumes:
      - ./docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    expose:
      - "80"

volumes:
  db-data:
  api-logs:
