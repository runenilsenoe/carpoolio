name: carpoolio

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-carpoolio}
      POSTGRES_USER: ${POSTGRES_USER:-carpoolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carpoolio} -d ${POSTGRES_DB:-carpoolio}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend/Carpoolio.Api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: Host=db;Port=5432;Database=${POSTGRES_DB:-carpoolio};Username=${POSTGRES_USER:-carpoolio};Password=${POSTGRES_PASSWORD}

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: "3000"
      CARPOOL_API_URL: http://api:8080/api

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
      - api
    volumes:
      - ./docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "${HTTP_PORT:-8080}:80"

volumes:
  db-data:
