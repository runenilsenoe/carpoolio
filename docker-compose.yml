name: carpoolio

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL (Supabase flavoured: includes pgjwt, pgcrypto, pg_net, etc.)
  # ----------------------------------------------------------------------------
  db:
    image: supabase/postgres:15.8.1.060
    container_name: carpoolio-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    volumes:
      - db-data:/var/lib/postgresql/data
      # Bootstrap: roles/schemas first, then every file in supabase/migrations.
      - ./docker/postgres/00-roles.sh:/docker-entrypoint-initdb.d/00-roles.sh:ro
      - ./docker/postgres/01-schemas.sql:/docker-entrypoint-initdb.d/01-schemas.sql:ro
      - ./docker/postgres/99-apply-migrations.sh:/docker-entrypoint-initdb.d/99-apply-migrations.sh:ro
      - ./supabase/migrations:/supabase-migrations:ro
    ports:
      # Host-only access for psql / backups. Remove to keep the DB fully internal.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ----------------------------------------------------------------------------
  # Supabase Auth (GoTrue)
  # ----------------------------------------------------------------------------
  auth:
    image: supabase/gotrue:v2.177.0
    container_name: carpoolio-auth
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: ${SUPABASE_PUBLIC_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}?search_path=auth&sslmode=disable
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${ENABLE_EMAIL_SIGNUP:-true}
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM:-true}
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_SMS_AUTOCONFIRM: "true"
      GOTRUE_LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9999/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ----------------------------------------------------------------------------
  # Supabase Data API (PostgREST)
  # ----------------------------------------------------------------------------
  rest:
    image: postgrest/postgrest:v12.2.12
    container_name: carpoolio-rest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS:-public,storage,graphql_public}
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: "3600"

  # ----------------------------------------------------------------------------
  # Supabase Realtime
  # ----------------------------------------------------------------------------
  realtime:
    image: supabase/realtime:v2.34.47
    container_name: carpoolio-realtime
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "4000"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-postgres}
      DB_AFTER_CONNECT_QUERY: "SET search_path TO _realtime"
      DB_ENC_KEY: ${REALTIME_ENC_KEY:?REALTIME_ENC_KEY is required}
      API_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${REALTIME_SECRET_KEY_BASE:?REALTIME_SECRET_KEY_BASE is required}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"

  # ----------------------------------------------------------------------------
  # Supabase Storage (+ imgproxy for transformations)
  # ----------------------------------------------------------------------------
  storage:
    image: supabase/storage-api:v1.19.3
    container_name: carpoolio-storage
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    environment:
      ANON_KEY: ${ANON_KEY:?ANON_KEY is required}
      SERVICE_KEY: ${SERVICE_ROLE_KEY:?SERVICE_ROLE_KEY is required}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
      FILE_SIZE_LIMIT: "52428800"
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: local
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: "true"
      IMGPROXY_URL: http://imgproxy:5001
    volumes:
      - storage-data:/var/lib/storage

  imgproxy:
    image: darthsim/imgproxy:v3.8.0
    container_name: carpoolio-imgproxy
    restart: unless-stopped
    environment:
      IMGPROXY_BIND: ":5001"
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_ENABLE_WEBP_DETECTION: "true"
    volumes:
      - storage-data:/var/lib/storage

  # ----------------------------------------------------------------------------
  # Kong: the single Supabase API gateway (api.carpoolio.example.com)
  # ----------------------------------------------------------------------------
  kong:
    image: kong:2.8.1
    container_name: carpoolio-kong
    restart: unless-stopped
    depends_on:
      - auth
      - rest
      - realtime
      - storage
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    volumes:
      - ./docker/kong/kong.yml:/home/kong/kong.template.yml:ro
    entrypoint:
      - bash
      - -c
      - "eval \"echo \\\"$$(cat /home/kong/kong.template.yml)\\\"\" > /home/kong/kong.yml && exec /docker-entrypoint.sh kong docker-start"

  # ----------------------------------------------------------------------------
  # Carpoolio app (TanStack Start SSR server + server functions)
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${SUPABASE_PUBLIC_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${ANON_KEY}
    container_name: carpoolio-app
    restart: unless-stopped
    depends_on:
      - kong
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Server-side calls go straight to Kong inside the Docker network.
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLISHABLE_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}

  # ----------------------------------------------------------------------------
  # nginx: public entrypoint for both hostnames (Cloudflare Tunnel points here)
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: carpoolio-nginx
    restart: unless-stopped
    depends_on:
      - app
      - kong
    environment:
      FRONTEND_HOST: ${FRONTEND_HOST:-carpoolio.example.com}
      API_HOST: ${API_HOST:-api.carpoolio.example.com}
      # Only substitute our own vars, leave nginx's $host/$uri intact.
      NGINX_ENVSUBST_FILTER: "^(FRONTEND_HOST|API_HOST)$$"

    volumes:
      - ./docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "${HTTP_PORT:-8080}:80"

volumes:
  db-data:
  storage-data:
